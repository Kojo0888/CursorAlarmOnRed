name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/CursorAlarmOnRed.Tests
      - run: dotnet build src/CursorAlarmOnRed -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: CursorAlarmOnRed
          path: src/CursorAlarmOnRed/bin/Release/net48/CursorAlarmOnRed.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/CursorAlarmOnRed/bin/Release/net48/CursorAlarmOnRed.exe
          generate_release_notes: true
